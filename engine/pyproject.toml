[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-matcher"
version = "0.1.0"
description = "Independent public transport stop and route matching against OpenStreetMap"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gtfs = ["pandas>=2.0"]
swiss = ["pandas>=2.0", "duckdb>=1.4,<2", "requests>=2.31", "shapely>=2.0", "geopandas>=0.14"]
acquisition = ["pandas>=2.0", "duckdb>=1.4,<2", "requests>=2.31", "shapely>=2.0", "geopandas>=0.14"]
test = ["pytest>=8"]

[project.scripts]
transport-matcher = "transport_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
