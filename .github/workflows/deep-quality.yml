name: Periodic quality
on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install pip-audit
      - run: npm ci
      - run: mkdir -p quality/raw
      - name: Audit application production dependencies
        run: pip-audit -r requirements.txt --format json --output quality/raw/python-audit.json
      - name: Audit browser and development dependencies
        if: always()
        run: npm audit --audit-level=high --json > quality/raw/npm-audit.json
      - name: Publish audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.sha }}
          path: quality/raw/*audit.json
