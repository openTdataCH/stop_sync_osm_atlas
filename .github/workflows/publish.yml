name: Publish Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push App
      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: app-stage
          push: true
          tags: ghcr.io/opentdatach/stop_sync_osm_atlas-app:latest

      # Build and Push Migrator
      - name: Build and push Migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: app-stage
          push: true
          tags: ghcr.io/opentdatach/stop_sync_osm_atlas-migrator:latest

      # Build and Push Scheduler
      - name: Build and push Scheduler image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: scheduler-stage
          push: true
          tags: ghcr.io/opentdatach/stop_sync_osm_atlas-scheduler:latest

      # Build and Push Test
      - name: Build and push Test image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: test-stage
          push: true
          tags: ghcr.io/opentdatach/stop_sync_osm_atlas-test:latest
