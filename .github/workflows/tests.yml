name: Quality
on:
  push:
    branches: [main]
    # A `make deploy-report` commit adds only the report of a commit CI already measured.
    paths-ignore: ['quality/published/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Required quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the engine pin
        id: engine
        run: echo "ref=$(cat engine.ref)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned engine
        uses: actions/checkout@v4
        with:
          # The engine repository is public, so the default token can read it.
          repository: openTdataCH/osm-public-transport-matcher
          ref: ${{ steps.engine.outputs.ref }}
          path: engine
      - name: Run required checks and generate evidence
        # The image and disposable PostGIS database of a local `make quality`.
        run: make quality ENGINE_DIR="$GITHUB_WORKSPACE/engine"
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Publish evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.sha }}
          path: quality/
          if-no-files-found: error
          retention-days: 30
