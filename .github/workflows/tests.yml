name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Required quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To upload the evidence as a release asset; see the last step.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the engine pin
        id: engine
        run: echo "ref=$(cat engine.ref)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned engine
        uses: actions/checkout@v4
        with:
          # The engine repository is public, so the default token can read it.
          repository: openTdataCH/osm-public-transport-matcher
          ref: ${{ steps.engine.outputs.ref }}
          path: engine
      - name: Run required checks and generate evidence
        # The image and disposable PostGIS database of a local `make quality`.
        run: make quality ENGINE_DIR="$GITHUB_WORKSPACE/engine"
      - name: Publish evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.sha }}
          path: quality/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the evidence for the code quality dashboard
        # A site running this commit downloads the file by the commit's ID. A release asset is public; a CI
        # artifact needs a token. Failed runs are published too: the dashboard shows what was measured.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('quality/evidence.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp quality/evidence.json "quality-$GITHUB_SHA.json"
          gh release view quality-data > /dev/null 2>&1 || gh release create quality-data --prerelease \
            --title "Code quality evidence" \
            --notes "One file for each commit of main, written by the Quality workflow and read by the code quality dashboard. Not a software release."
          gh release upload quality-data "quality-$GITHUB_SHA.json" --clobber
          # Keep the newest 60 commits.
          gh release view quality-data --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[60:][].name' \
            | while read -r name; do gh release delete-asset quality-data "$name" --yes; done
