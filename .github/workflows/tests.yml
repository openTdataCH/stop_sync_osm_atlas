name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  documentation-links:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check documentation links
        run: |
          python3 << 'EOF'
          import os
          from pathlib import Path
          import re
          import sys

          docs_dir = Path("documentation")
          broken_links = []
          total_links = 0

          print("Checking documentation links...")
          print("=" * 60)

          for md_file in sorted(docs_dir.glob("*.md")):
              with open(md_file, encoding='utf-8') as f:
                  content = f.read()
              
              # Find all markdown links to .md files
              links = re.findall(r'\[[^\]]+\]\(([^)]+\.md[^)]*)\)', content)
              
              for link in links:
                  total_links += 1
                  # Clean URL (remove URL encoding and anchors)
                  clean_link = link.split('#')[0].replace('%20', ' ')
                  target = docs_dir / clean_link
                  
                  if not target.exists():
                      broken_links.append({
                          'file': md_file.name,
                          'link': link,
                          'target': str(target)
                      })

          print(f"Total links checked: {total_links}")
          print(f"Broken links found: {len(broken_links)}")
          print()

          if broken_links:
              print("❌ BROKEN LINKS DETECTED:")
              print("=" * 60)
              for item in broken_links:
                  print(f"\nFile: {item['file']}")
                  print(f"  Link: {item['link']}")
                  print(f"  Target: {item['target']}")
              sys.exit(1)
          else:
              print("✅ All documentation links are valid!")
              sys.exit(0)
          EOF

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --coverage --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-coverage-report
          path: coverage/
          retention-days: 7

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        continue-on-error: true
        run: black --check --diff .

      - name: Check import sorting with isort
        continue-on-error: true
        run: isort --check-only --diff .

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        run: |
          pytest tests/ --cov=matching_process --cov=backend --cov-report=xml --cov-report=html -v
        env:
          FLASK_ENV: testing
          TESTING: 'true'
          DATABASE_URI: 'sqlite:///:memory:'
          AUTH_DATABASE_URI: 'sqlite:///:memory:'
          SECRET_KEY: 'test-secret-key'

      - name: Upload Python coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 7
          if-no-files-found: ignore
