name: Tests
on:
  push:
    branches: [main, master, develop]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    name: Independent review app and PostGIS publication
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transport_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d transport_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: sqlite://
      TEST_POSTGRES_URI: postgresql+psycopg://test:test@localhost:5432/transport_test
      STATE_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned engine documentation
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPOSITORY }}
          ref: ${{ vars.ENGINE_REF }}
          token: ${{ secrets.ENGINE_REPOSITORY_TOKEN }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: pip install -r requirements-base.txt -r requirements-web.txt -r requirements-scheduler.txt -r requirements-test.txt
      - name: Test without installing engine
        run: python -m pytest tests -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --ci
      - run: npm run vendor:check-cdn
  contract:
    name: Engine producer to app consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned engine producer
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPOSITORY }}
          ref: ${{ vars.ENGINE_REF }}
          token: ${{ secrets.ENGINE_REPOSITORY_TOKEN }}
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install './engine[swiss,gtfs,test]'
      - name: Validate progress across the process boundary
        run: PROGRESS_CONTRACT_ENGINE=engine python -m pytest tests/test_engine_progress_contract.py -q
      - run: transport-matcher gtfs --source engine/examples/gtfs --namespace demo --osm engine/examples/osm.xml --output /tmp/result
      - run: python -c 'from backend.importing.bundle import read_bundle; b = read_bundle("/tmp/result"); assert b["matches"] and b["routes"]'
