name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  documentation-links:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation links
        run: |
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" --entrypoint '' \
            -e DATABASE_URI=sqlite:// \
            test python -m pytest tests/test_docs_links.py -v

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --coverage --ci

      - name: Verify No CDN Template URLs
        run: npm run vendor:check-cdn

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-coverage-report
          path: coverage/
          retention-days: 7

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements-base.txt
            requirements-web.txt
            requirements-scheduler.txt
            requirements-test.txt

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check formatting with black
        continue-on-error: true
        run: black --check --diff .

      - name: Check import sorting with isort
        continue-on-error: true
        run: isort --check-only --diff .

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Auto-update documentation text and plot
        run: python documentation/scripts/generate_dependency_overlap.py

      - name: Commit documentation changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(deps): auto-update dependency overlap matrix & text"

      - name: Run Python tests
        run: |
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" --entrypoint '' \
            -e FLASK_ENV=testing \
            -e TESTING=true \
            -e DATABASE_URI=sqlite:// \
            -e SECRET_KEY=test-secret-key \
            test python -m pytest tests/ --cov=matching_and_import_db --cov=backend --cov-report=xml --cov-report=html -v

      - name: Upload Python coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-report
          path: htmlcov/
          retention-days: 7
          if-no-files-found: ignore
