{% extends "layouts/base.html" %}

{% block title %}Documentation{% endblock %}

{% block head_css %}
  <style>
    .docs-container { padding: 1rem; }
    .docs-sidebar { border-right: 1px solid #e9ecef; max-width: 280px; }
    .docs-sidebar .list-group-item.active { background-color: #f8f9fa; color: #212529; font-weight: 600; }
    .docs-content img { max-width: 100%; height: auto; }
    .docs-content pre { background: #f8f9fa; padding: .75rem; border-radius: .25rem; overflow: auto; }
    .docs-content table { width: 100%; }
  </style>
{% endblock %}

{% block content %}
<div class="container-fluid docs-container">
  <div class="row">
    <div class="col-md-3 docs-sidebar pr-0">
      <div class="list-group list-group-flush">
        {% for file, title in sidebar_items %}
          <a class="list-group-item list-group-item-action{% if file == active_file %} active{% endif %}" href="{{ url_for('docs.docs_page', page=file[:-3]) }}">{{ title }}</a>
        {% endfor %}
      </div>
    </div>
    <div class="col-md-9 docs-content">
      <div class="card">
        <div class="card-body">
          {{ content_html | safe }}
        </div>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back to Map</a>
  </div>
  <div class="mt-2">
    <small class="text-muted">Images and assets served from <code>/docs/assets/</code>.</small>
  </div>
{% endblock %}
