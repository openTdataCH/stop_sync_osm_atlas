<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Report{% endblock %}</title>
    <!-- Dependencies for PDF rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        /* Inject the combined CSS from backend */
        {{ css_content|safe }}

        /* PDF-specific layout overrides from printable_core.css are already in css_content 
           if we update the service correctly. Any page-specific overrides go here: */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="report-header">
        {% block header %}{% endblock %}
    </div>

    <div class="report-body">
        {% block content %}{% endblock %}
    </div>

    <div class="report-footer">
        {% block footer %}{% endblock %}
    </div>
</body>
</html>
