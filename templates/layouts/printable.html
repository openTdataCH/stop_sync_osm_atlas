<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Report{% endblock %}</title>
    <!-- Dependencies for PDF rendering -->
    {% set vendor_prefix = pdf_assets_prefix|default('/static/vendor/') %}
    <link rel="stylesheet" href="{{ vendor_prefix }}bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ vendor_prefix }}font-awesome/css/all.min.css">
    <style>
        /* Inject the combined CSS from backend */
        {{ css_content|safe }}

        /* PDF-specific layout overrides from printable_core.css are already in css_content 
           if we update the service correctly. Any page-specific overrides go here: */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="report-header">
        {% block header %}{% endblock %}
    </div>

    <div class="report-body">
        {% block content %}{% endblock %}
    </div>

    <div class="report-footer">
        {% block footer %}{% endblock %}
    </div>
</body>
</html>
