      "id": "app.snapshot-publication",
      "title": "Snapshot import and atomic publication",
      "criticality": "critical",
      "responsibility": "Validate bundles, stage their projection, and atomically publish a complete snapshot while preserving the previous dataset on failure.",
      "owner": "OSM Atlas maintainers",
      "reviewed": "2026-09-22",
      "paths": {
        "source": [
          "backend/importing/**"
        ],
        "tests": [
          "tests/test_result_bundle.py",
          "tests/test_bundle_properties.py",
          "tests/test_import_projection.py",
          "tests/test_snapshot_publication.py",
          "tests/test_db_connection_options.py"
        ]
      },
      "docs": {
        "explanation": [
          "documentation/1.1 Bundle import and publication.md"
        ],
        "reference": [
          "documentation/1. Database & bundle import.md"
        ],
        "operations": [
          "documentation/1.1 Bundle import and publication.md"
        ],
        "decision": [
          "quality/decisions.md"
        ]
      },
      "invariants": [
        "Validate before database writes.",
        "Publish while holding the publication lock.",
        "A failed pre-commit import preserves the active snapshot."
      ],
      "entrypoints": [
        "backend.importing.bundle:read_bundle",
        "backend.importing.publication:publish_snapshot"
      ],
      "dependencies": [
        "app.query-api"
      ],
      "contracts": {
        "consumes": [
          "result-bundle-v1"
        ],
        "database": [
          "active-snapshot-schema"
        ]
      }
    },
