# Every service builds from this checkout's dockerfile; only the stage differs.
x-build: &build
  context: .
  target: app-stage
  additional_contexts:
    # The engine checkout; scripts/verify_engine_checkout.sh checks it is at engine.ref.
    engine: ${ENGINE_DIR:-../engine}
  args:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}

# The settings every container receives. A name without a value takes it from .env or the shell and stays unset
# otherwise, so each default lives in the code alone (documentation/3. Application architecture & deployment.md,
# section "Settings"). Values are given only where Docker differs: the database container, and a larger GTFS
# memory budget for the 4 GB scheduler. ENGINE_DIR is a path on the host and is deliberately not passed.
x-settings: &settings
  DATABASE_URI: ${DATABASE_URI:-postgresql+psycopg://stops_user:1234@db:5432/import_db}
  REVIEW_CONFIG:
  FORCE_HTTPS:
  RATELIMIT_STORAGE_URI:
  WEB_DB_CONNECT_TIMEOUT_SECONDS:
  WEB_DB_LOCK_TIMEOUT_MS:
  WEB_DB_STATEMENT_TIMEOUT_MS:
  STATE_DIR:
  PIPELINE_SCHEDULE_INTERVAL_HOURS:
  PIPELINE_TIMEZONE:
  PIPELINE_FORCE_FULL_REFRESH:
  PIPELINE_MAX_DROP_PERCENT:
  PIPELINE_LOG_LEVEL:
  PIPELINE_LOCK_TTL_SECONDS:
  PIPELINE_LOCK_HEARTBEAT_SECONDS:
  PIPELINE_LOCK_STALE_SECONDS:
  PIPELINE_WATCHDOG_INTERVAL_SECONDS:
  PIPELINE_WORKSPACE:
  PIPELINE_BUNDLE_DIR:
  MATCHER_COMMAND:
  OVERPASS_API_URL:
  DB_IMPORT_BATCH_SIZE:
  GTFS_PROCESSING_BACKEND:
  GTFS_THREADS:
  GTFS_MEMORY_LIMIT: ${GTFS_MEMORY_LIMIT:-1536MB}

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: stop_sync_osm_atlas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: import_db
      POSTGRES_USER: stops_user
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432" # Exposes Postgres to your host machine on port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 2
      # A new volume first runs initdb and installs PostGIS, then restarts the server.
      start_period: 90s
      start_interval: 2s

  migrator:
    image: stop_sync_osm_atlas-migrator
    build: *build
    container_name: stop_sync_osm_atlas_migrator
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - "python backend/importing/init.py && flask db upgrade"
    volumes:
      # The checkout replaces the image's copy, so code edits apply without a rebuild.
      - .:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment: *settings

  app:
    image: stop_sync_osm_atlas-app
    build: *build
    container_name: stop_sync_osm_atlas_app
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - ./data:/app/data
      # The engine's documentation, shown in the portal.
      - ${ENGINE_DIR:-../engine}:/app/engine:ro
    depends_on:
      db:
        condition: service_healthy # Waits for db to be healthy before starting app
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *settings
      FLASK_DEBUG: ${FLASK_DEBUG:-1} # 1 = Flask debugger, 0 = Gunicorn
    cpu_shares: 2048 # Higher CPU priority during contention
    mem_limit: 2g # Web app stays lighter, pipeline runs in scheduler service
    # mem_reservation: 1g # Optional: guarantee 1g

  scheduler:
    image: stop_sync_osm_atlas-scheduler
    build:
      <<: *build
      target: scheduler-stage
    container_name: stop_sync_osm_atlas_scheduler
    restart: unless-stopped
    command: ["scheduler"]
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment: *settings
    cpu_shares: 2048
    mem_limit: 4g

volumes:
  postgres_data: # Persists Postgres data
