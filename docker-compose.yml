services:
  redis:
    image: redis:7-alpine
    container_name: stop_sync_osm_atlas_redis
    restart: "no"
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: postgis/postgis:16-3.4
    container_name: stop_sync_osm_atlas_db
    restart: "no"
    environment:
      POSTGRES_DB: import_db
      POSTGRES_USER: stops_user
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432" # Exposes Postgres to your host machine on port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 2

  migrator:
    image: ghcr.io/opentdatach/stop_sync_osm_atlas-migrator:latest
    container_name: stop_sync_osm_atlas_migrator
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command: "python matching_and_import_db/database/init.py && flask db upgrade"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: backend/app.py
      DATABASE_URI: ${DATABASE_URI:-postgresql+psycopg://stops_user:1234@db:5432/import_db}
      RATELIMIT_STORAGE_URI: memory://

  app:
    image: ghcr.io/opentdatach/stop_sync_osm_atlas-app:latest
    container_name: stop_sync_osm_atlas_app
    restart: "no"
    ports:
      - "5001:5001"
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy # Waits for db to be healthy before starting app
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      # Flask environment variables (some are also in Dockerfile for explicitness)
      FLASK_APP: backend/app.py
      FLASK_ENV: development # Or production
      FLASK_DEBUG: 1 # Enables Flask debugger
      # Database URI for SQLAlchemy, now configurable via .env
      DATABASE_URI: ${DATABASE_URI:-postgresql+psycopg://stops_user:1234@db:5432/import_db}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure}
      FORCE_HTTPS: "false"
      SESSION_COOKIE_SECURE: "false"
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
    cpu_shares: 2048 # Higher CPU priority during contention
    mem_limit: 2g # Web app stays lighter, pipeline runs in scheduler service
    # mem_reservation: 1g # Optional: guarantee 1g

  test:
    image: ghcr.io/opentdatach/stop_sync_osm_atlas-test:latest
    container_name: stop_sync_osm_atlas_test
    restart: "no"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql+psycopg://stops_user:1234@db:5432/import_db}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}

  scheduler:
    image: ghcr.io/opentdatach/stop_sync_osm_atlas-scheduler:latest
    container_name: stop_sync_osm_atlas_scheduler
    restart: "no"
    command: ["scheduler"]
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URI: ${DATABASE_URI:-postgresql+psycopg://stops_user:1234@db:5432/import_db}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      PIPELINE_TIMEZONE: ${PIPELINE_TIMEZONE:-Europe/Zurich}
      PIPELINE_SCHEDULE_INTERVAL_HOURS: ${PIPELINE_SCHEDULE_INTERVAL_HOURS:-24}
      PIPELINE_IMPORT_ETA_SECONDS: ${PIPELINE_IMPORT_ETA_SECONDS:-150}
    cpu_shares: 2048
    mem_limit: 4g

volumes:
  postgres_data: # Persists Postgres data
