<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 78 960 325" width="960" height="325" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Pipeline phases and run modes</title>
<desc id="diagram-desc">A pipeline run has eight phases. The engine performs the first six: check sources, prepare source files, load matching inputs, stop matching, route matching and building the result bundle. The review application performs the last two: staging the database and publishing the dataset. Mode full runs every phase. Mode match-import skips the source check and reuses the existing source files. Mode import skips everything up to the bundle, reuses an existing bundle and only stages and publishes it.</desc>
