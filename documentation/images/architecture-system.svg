<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 960 626" width="960" height="626" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">System architecture</title>
<desc id="diagram-desc">The review application's pipeline runner starts the separately installed matching engine as a command-line process and reads its progress events. The engine downloads or reuses public sources in its workspace, matches them and writes a result bundle. The runner then imports the bundle: it validates it, loads a private staging schema and switches the public PostGIS tables. The Flask web application serves pages and a JSON API from the published snapshot and reads runtime status files.</desc>
