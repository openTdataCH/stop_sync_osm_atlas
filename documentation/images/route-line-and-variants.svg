<title id="route-line-and-variants-title">A line and its variants</title>
<desc id="route-line-and-variants-desc">An illustrative bus line 31 on both sides. In the GTFS timetable the line is a route, and its trips form one variant per direction and headsign. In OpenStreetMap the line is a route master relation, and each of its route relations is one variant. The site matches the two lines first (1), then pairs their variants (2). Two variants are paired; the third GTFS variant, a short run to Markt, has no route relation in OSM and stays unmatched.</desc>
