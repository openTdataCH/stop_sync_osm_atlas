<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 71 960 433" width="960" height="433" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">How the project works</title>
<desc id="diagram-desc">Public sources enter the matching engine, a separate repository, through format adapters and a dataset profile. Its source-neutral core matches stops, compares routes and detects problems, then writes a versioned result bundle. The review application in this repository runs a pinned engine release on a schedule, imports each bundle and shows it on a website; other sites and scripts can use the same bundle. Reviewers use the findings to fix OpenStreetMap and report ATLAS issues.</desc>
