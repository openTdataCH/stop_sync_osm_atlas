<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 57 960 369" width="960" height="369" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">How the project works</title>
<desc id="diagram-desc">Public sources (ATLAS, GTFS, OpenStreetMap) flow into the matching engine, which writes a versioned result bundle. The review application imports the bundle and shows it on a website. The review application starts the engine on a schedule. Reviewers use the findings to fix OpenStreetMap and report ATLAS issues.</desc>
