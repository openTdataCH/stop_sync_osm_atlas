<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 82 960 345" width="960" height="345" role="img" aria-labelledby="osm-stop-units-title osm-stop-units-desc">
<title id="osm-stop-units-title">The three kinds of OSM stop unit</title>
<desc id="osm-stop-units-desc">Three illustrative stops. A single element is one OSM node or way, matched to one ATLAS platform. A pair is a platform node with its stop position: the platform is matched and the stop position follows by propagation. A two-sided stop is one stop position with a platform on each side of the road: each platform is matched to its own ATLAS platform, and the stop position in the middle counts as effectively matched.</desc>
