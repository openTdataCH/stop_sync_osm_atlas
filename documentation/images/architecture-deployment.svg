<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 66 960 640" width="960" height="640" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Deployment with Docker Compose</title>
<desc id="diagram-desc">Docker Compose runs the app, scheduler, db and one-shot migrator services. The app container serves the website on port 5001 and reads the database. The scheduler container runs the pipeline runner, which starts the installed transport-matcher CLI as a subprocess, then imports the bundle in the same process and switches the database snapshot. The db container runs PostgreSQL with PostGIS on the postgres_data volume; the migrator upgrades its schema before the other services start. The host folder ./data is mounted into every application container and holds the engine workspace, result bundles, runtime state and analytics files.</desc>
