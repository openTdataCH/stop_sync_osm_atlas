<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 67 960 416" width="960" height="416" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Importing and publishing a snapshot</title>
<desc id="diagram-desc">The importer validates the bundle without database access, projects it onto application rows, creates a private staging schema with the table constraints, loads the rows with COPY and builds indexes. Readers keep using the published run during all of this. One short transaction then moves the old tables out of the public schema and the staged tables in, and records the new run. If anything fails before that commit, the staging schema is dropped and the previous run stays published.</desc>
