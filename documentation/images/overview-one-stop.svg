<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 71 960 496" width="960" height="496" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">One stop in three datasets</title>
<desc id="diagram-desc">An illustrative stop with two platforms. In OpenStreetMap each platform is a pair of nodes: a platform node and a stop position on the road. ATLAS has one record per platform, identified by a SLOID and sharing the station UIC number. GTFS has one stop per platform; in the current Swiss feed its stop_id is the SLOID. The project groups OSM nodes into stop units (1), links ATLAS platforms to OSM stops (2), maps GTFS stop_ids to SLOIDs (3) and pairs GTFS routes with OSM route relations (4).</desc>
