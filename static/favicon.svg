<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="-251 -251 502 502">
  <!-- Sync badge on a tile drawn from geometry around (0,0): OSM's green arrow and ATLAS's blue arrow
       are one shape, the blue turned 180 degrees; the Swiss cross has arms 7/6 as long as wide.
       r_red=172, gap=13, band=46, barb=42, tail=170, base=310, tip=345, tip_r=0.7, arm=64, round=10 -->
  <rect x="-251" y="-251" width="502" height="502" rx="80" fill="#fcfcfc"/>
  <defs>
    <path id="arrow" d="M-222.57 39.24A226 226 0 0 1 145.27 -173.13L172.27 -205.3L209.8 -56.22L95.13 -113.37L122.13 -145.55A190 190 0 0 0 -187.11 32.99Z"/>
